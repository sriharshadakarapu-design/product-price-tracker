
name: Product Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: product-price-tracker
  cancel-in-progress: false

jobs:
  price-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price tracker
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          PRICE_LIMIT: ${{ secrets.PRICE_LIMIT }}
        run: python tracker.py

      - name: Save price history
        run: |
          touch price_history.csv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.json price_history.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update product price history"
            git push
          else
            echo "No changes to save"
          fi
